# gitleaks configuration: the default rules, plus one narrow allowlist.
[extend]
useDefault = true

# In Cargo.lock, a dependency list such as `"libcrux-secrets",` followed by `"libcrux-sha3",`
# trips the generic-api-key heuristic: "secrets" reads as a key name and the next crate name as
# its value. Only that rule is relaxed, and only when all of these hold: a Cargo.lock path, and
# a matched text that is nothing but quoted crate names separated by a comma and whitespace
# (review P3R3-6: an earlier, wider version also hid hex and Heroku-style keys).
[[allowlists]]
description = "crate names in Cargo.lock dependency lists"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(^|/)Cargo\.lock$''']
regexTarget = "match"
regexes = ['''\A"?[a-z0-9][a-z0-9_-]*"?,\s*"[a-z0-9][a-z0-9_-]*"?\z''']
