[package]
name = "veil-client"
version = "0.1.0"
description = "Veil client: encrypted local store, pinned relay connection and the command API used by the app."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
veil-core.workspace = true
veil-wire.workspace = true
tokio = { workspace = true, features = ["rt"] }
tokio-tungstenite.workspace = true
tokio-rustls.workspace = true
rustls.workspace = true
futures-util.workspace = true
ed25519-dalek.workspace = true
sha2.workspace = true
rand.workspace = true
subtle.workspace = true
zeroize.workspace = true
thiserror.workspace = true
rusqlite.workspace = true
qrcode.workspace = true
serde.workspace = true
base64.workspace = true

[target.'cfg(windows)'.dependencies]
keyring.workspace = true

[features]
# Hooks for this crate's own integration tests (crafted content from a "hostile" contact).
# The app never enables it.
test-hooks = []

[dev-dependencies]
# The integration tests use the test hooks above.
veil-client = { path = ".", features = ["test-hooks"] }
veil-relay.workspace = true
tempfile.workspace = true

[lints]
workspace = true
