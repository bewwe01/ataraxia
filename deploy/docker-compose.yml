# Veil relay + coturn. See deploy/README.md for the full walkthrough.
#
#   cd deploy
#   cp .env.example .env && $EDITOR .env
#   mkdir -m 0700 secrets && openssl rand -hex 32 > secrets/turn_secret && chmod 0644 secrets/turn_secret
#   docker compose build
#   docker compose run --rm relay gen-cert /data/tls <your-dns-name-or-ip>   # prints the SPKI pin
#   docker compose up -d
name: veil

services:
  relay:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: veil-relay:local
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 512m
    ports:
      # Host port from VEIL_PORT in .env (default 8443), e.g. 8444 if something else uses 8443.
      - "${VEIL_PORT:-8443}:8443/tcp"
    volumes:
      - relay-data:/data
    environment:
      VEIL_TURN_SECRET_FILE: /run/secrets/turn_secret
      VEIL_TURN_URLS: ${VEIL_TURN_URLS:?set VEIL_TURN_URLS in deploy/.env}
      # Where coturn relays media, announced to clients that reach the relay by a name
      # (Tailscale Funnel, ADR-0018). The same value coturn advertises.
      VEIL_TURN_RELAY_IPS: ${TURN_EXTERNAL_IP:?set TURN_EXTERNAL_IP in deploy/.env}
      VEIL_LOG: ${VEIL_LOG:-info}
      VEIL_QUOTA_ENVELOPES_MB: ${VEIL_QUOTA_ENVELOPES_MB:-1024}
      VEIL_QUOTA_BLOBS_MB: ${VEIL_QUOTA_BLOBS_MB:-4096}
      VEIL_DB_CACHE_MB: ${VEIL_DB_CACHE_MB:-64}
      VEIL_MAX_CONN_PER_SOURCE: ${VEIL_MAX_CONN_PER_SOURCE:-32}
    secrets: [turn_secret]
    logging:
      driver: local
      options: { max-size: "5m", max-file: "2" }

  coturn:
    image: docker.io/coturn/coturn:4.18.0@sha256:bbefd3e1fdfdc0d58770fe01b581fd8b00d9f3a5580d00acb77cf719a6bc78e3
    restart: unless-stopped
    # Host networking: TURN needs a large UDP port range, which Docker's userland proxy handles badly.
    network_mode: host
    read_only: true
    cap_drop: [ALL]
    # The image's turnserver binary carries file capabilities (cap_net_bind_service); the kernel
    # refuses to exec it unless that capability stays in the bounding set. It binds only 3478 and
    # 49160-49259 here, so the capability is never used.
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 256m
    user: "65534:65534"
    entrypoint: ["/bin/sh", "/veil/entrypoint.sh"]
    tmpfs:
      - /run/coturn:mode=0700,uid=65534,gid=65534,size=1m
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/veil.conf:ro
      - ./coturn/entrypoint.sh:/veil/entrypoint.sh:ro
    environment:
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP:?set TURN_EXTERNAL_IP in deploy/.env}
      # Optional: listen only on this address (see .env.example).
      TURN_LISTEN_IP: ${TURN_LISTEN_IP:-}
    secrets: [turn_secret]
    logging:
      driver: local
      options: { max-size: "1m", max-file: "2" }

secrets:
  turn_secret:
    file: ./secrets/turn_secret

volumes:
  relay-data:
