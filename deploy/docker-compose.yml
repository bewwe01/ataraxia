# Veil relay + coturn. See deploy/README.md for the full walkthrough.
#
#   cd deploy
#   cp .env.example .env && $EDITOR .env
#   mkdir -m 0700 secrets && openssl rand -hex 32 > secrets/turn_secret && chmod 0644 secrets/turn_secret
#   docker compose build
#   docker compose run --rm relay gen-cert /data/tls <your-dns-name-or-ip>   # prints the SPKI pin
#   docker compose up -d
name: veil

services:
  relay:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: veil-relay:local
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 512m
    ports:
      - "8443:8443/tcp"
    volumes:
      - relay-data:/data
    environment:
      VEIL_TURN_SECRET_FILE: /run/secrets/turn_secret
      VEIL_TURN_URLS: ${VEIL_TURN_URLS:?set VEIL_TURN_URLS in deploy/.env}
      VEIL_LOG: ${VEIL_LOG:-info}
      VEIL_QUOTA_ENVELOPES_MB: ${VEIL_QUOTA_ENVELOPES_MB:-4096}
      VEIL_QUOTA_BLOBS_MB: ${VEIL_QUOTA_BLOBS_MB:-20480}
    secrets: [turn_secret]
    logging:
      driver: local
      options: { max-size: "5m", max-file: "2" }

  coturn:
    image: docker.io/coturn/coturn:4.7.0@sha256:a00afb5b4890de4df22bbe70379c6b316685dffee297d53cac1271dcb91fab93
    restart: unless-stopped
    # Host networking: TURN needs a large UDP port range, which Docker's userland proxy handles badly.
    network_mode: host
    read_only: true
    cap_drop: [ALL]
    # The image's turnserver binary carries file capabilities (cap_net_bind_service); the kernel
    # refuses to exec it unless that capability stays in the bounding set. It binds only 3478 and
    # 49160-49259 here, so the capability is never used.
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 256m
    user: "65534:65534"
    entrypoint: ["/bin/sh", "/veil/entrypoint.sh"]
    tmpfs:
      - /run/coturn:mode=0700,uid=65534,gid=65534,size=1m
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/veil.conf:ro
      - ./coturn/entrypoint.sh:/veil/entrypoint.sh:ro
    environment:
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP:?set TURN_EXTERNAL_IP in deploy/.env}
    secrets: [turn_secret]
    logging:
      driver: local
      options: { max-size: "1m", max-file: "2" }

secrets:
  turn_secret:
    file: ./secrets/turn_secret

volumes:
  relay-data:
