# docker.service drop-in: install as /etc/systemd/system/docker.service.d/veil-turn.conf.
# Docker (and so coturn) does not start unless the Veil TURN rule is loaded.
[Unit]
Wants=veil-turn-firewall.service
After=veil-turn-firewall.service

[Service]
ExecStartPre=/usr/sbin/nft list table inet veil_turn
