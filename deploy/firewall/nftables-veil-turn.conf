# nftables.service drop-in: install as /etc/systemd/system/nftables.service.d/veil-turn.conf.
# The distribution's /etc/nftables.conf usually starts with `flush ruleset`, which removes every
# table, ours included. These lines re-load the Veil TURN rule after each start, reload and stop
# of nftables.service, in the same systemd job (review P3R4-3).
[Service]
ExecStartPost=/usr/sbin/nft -f /etc/veil-turn.nft
ExecReload=
ExecReload=/usr/sbin/nft -f /etc/nftables.conf
ExecReload=/usr/sbin/nft -f /etc/veil-turn.nft
ExecStopPost=/usr/sbin/nft -f /etc/veil-turn.nft
