# coturn configuration for a Veil relay (TURN for calls; PROTOCOL.md §8, INV-NET-1).
#
# Calls are end-to-end encrypted (DTLS-SRTP); TURN only forwards ciphertext. This file hardens
# coturn so it is a TURN relay for Veil peers and nothing else. entrypoint.sh appends the
# deployment-specific lines (static-auth-secret, external-ip, allowed-peer-ip) at start-up.

listening-port=3478
# Relay endpoints. Each call leg uses one port; forward this UDP range on your router.
min-port=49160
max-port=49259

# Ephemeral HMAC credentials minted by veil-relay for authenticated mailboxes only (TURN REST API).
use-auth-secret
realm=veil
fingerprint
stale-nonce=600
max-allocate-lifetime=3600
user-quota=4
total-quota=100
# 1 MB/s (8 Mbit/s) per session: ample for Opus audio, video and 1080p60 screen sharing
# (6 Mbit/s at most), bounds abuse.
max-bps=1000000

# Plain TURN only. The media inside is DTLS-SRTP, and WebRTC verifies `turns:` certificates
# against public CAs, which a self-signed relay cannot satisfy. See deploy/README.md.
no-tls
no-dtls

# Attack surface.
no-cli
no-tcp-relay
no-multicast-peers
pidfile=/run/coturn/turnserver.pid

# Relay to nobody but this server itself. Every Veil call is relayed through this one server,
# so both legs are allocations here and a peer is always this server's own external address,
# which entrypoint.sh re-allows (allowed-peer-ip wins over denied-peer-ip). Everything else is
# refused: the LAN, your tailnet, cloud metadata, and the whole internet. Even someone who gets
# TURN credentials (mailbox creation is open, and Funnel puts coturn on the internet) cannot
# use this server to send traffic anywhere else (ADR-0018).
denied-peer-ip=0.0.0.0-255.255.255.255
denied-peer-ip=::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# No logs: coturn would otherwise record client IP addresses, and Veil keeps no connection records
# (INV-LOG-1). For debugging, temporarily replace these two lines with `verbose`.
no-stdout-log
syslog
