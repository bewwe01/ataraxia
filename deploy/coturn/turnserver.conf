# coturn configuration for a Veil relay (TURN for calls; PROTOCOL.md §8, INV-NET-1).
#
# Calls are end-to-end encrypted (DTLS-SRTP); TURN only forwards ciphertext. This file hardens
# coturn so it is a TURN relay for Veil peers and nothing else. entrypoint.sh appends the
# deployment-specific lines (static-auth-secret, external-ip, allowed-peer-ip) at start-up.

listening-port=3478
# Relay endpoints. Each call leg uses one port; forward this UDP range on your router.
min-port=49160
max-port=49259

# Ephemeral HMAC credentials minted by veil-relay for authenticated mailboxes only (TURN REST API).
use-auth-secret
realm=veil
fingerprint
stale-nonce=600
max-allocate-lifetime=3600
user-quota=4
total-quota=100
# 1 MB/s per session: ample for Opus audio and 720p video, bounds abuse.
max-bps=1000000

# Plain TURN only. The media inside is DTLS-SRTP, and WebRTC verifies `turns:` certificates
# against public CAs, which a self-signed relay cannot satisfy. See deploy/README.md.
no-tls
no-dtls

# Attack surface.
no-cli
no-tcp-relay
no-multicast-peers
pidfile=/run/coturn/turnserver.pid

# Never relay into private, loopback, link-local, CGNAT, documentation or reserved space: this stops
# the TURN server being used to reach your LAN, your Tailscale tailnet or cloud metadata services.
# (entrypoint.sh re-allows this server's own external address, which relayed peers need.)
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::-::ffff:ffff:ffff
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=100::-100::ffff:ffff:ffff:ffff
denied-peer-ip=2001:db8::-2001:db8:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# No logs: coturn would otherwise record client IP addresses, and Veil keeps no connection records
# (INV-LOG-1). For debugging, temporarily replace these two lines with `verbose`.
no-stdout-log
syslog
