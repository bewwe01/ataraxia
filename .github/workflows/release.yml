# Release builds: Android APK (arm64) and Windows installer (NSIS), published to a GitHub
# pre-release with SHA-256 checksums when a version tag is pushed.
#
# Runs only when started by hand (Actions → release → Run workflow) or for a pushed version tag,
# so ordinary pushes cost no Actions minutes. Without a tag it only builds (unsigned APK as an
# artifact). Build jobs never see a signing secret (review P4-5); with a tag, a separate job in
# the protected `release` environment downloads the unsigned APK and signs it without running
# any project code.
#
# Every build gets a higher Android versionCode (100000 + run number), so a newer APK signed
# with the same key installs over the old one and keeps the app's data.
#
# Signing, stated plainly:
# - Android: signed with the release keystore from the `release` environment's secrets when
#   they are set (ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS).
#   Otherwise with a throwaway key generated in that run: such an APK installs, but the next
#   release cannot update it in place (uninstall first, which deletes local data).
# - Windows: not code-signed. SmartScreen will warn; check the SHA-256 instead.
name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, e.g. v0.1.0-preview.1 (empty: build only)"
        required: false
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "10.28.0"
      - name: Typecheck, lint, build, audit
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm lint
          pnpm build
          pnpm audit --prod

  # The app's own Cargo workspace (Tauri and the webview bindings) gets the same deny and
  # audit gates as the root workspace (review P4-7).
  app-supply-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tools (built from source, exact versions)
        run: |
          rustup toolchain install 1.97.0 --profile minimal && rustup default 1.97.0
          cargo install cargo-deny --version 0.20.2 --locked
          cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo deny --manifest-path app/src-tauri/Cargo.toml --config deny.toml --locked check
      # Ignored, with reasons: RUSTSEC-2024-0370 and RUSTSEC-2026-0173 are "unmaintained"
      # notices for proc-macro-error(2), build-time macro crates of Tauri's GTK stack;
      # RUSTSEC-2024-0429 is an unsoundness in glib's VariantStrIter, and glib is only built
      # for Linux, which this workflow does not ship (Windows and Android only).
      - run: >
          cargo audit --file app/src-tauri/Cargo.lock --deny warnings
          --ignore RUSTSEC-2024-0370 --ignore RUSTSEC-2026-0173 --ignore RUSTSEC-2024-0429

  android:
    needs: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          df -h /

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "10.28.0"

      - name: Rust toolchain, Android target, protoc
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          rustup default 1.97.0
          rustup target add aarch64-linux-android
          sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          # OpenSSL (vendored for SQLCipher) configures itself for Android from these.
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Build release APK (arm64, unsigned)
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          # A versionCode that only grows, so updates install over older builds.
          python3 - "$GITHUB_RUN_NUMBER" <<'PY'
          import json, sys
          p = "src-tauri/tauri.conf.json"
          c = json.load(open(p))
          c.setdefault("bundle", {}).setdefault("android", {})["versionCode"] = 100000 + int(sys.argv[1])
          json.dump(c, open(p, "w"), indent=2)
          PY
          pnpm tauri android init --ci
          pnpm tauri icon app-icon.png
          # No backups of the vault, FLAG_SECURE (review P4-4, P4-8).
          python3 android/harden.py src-tauri/gen/android
          pnpm tauri android build --target aarch64 --apk --ci -- --locked
          mkdir -p ../out
          cp "$(find src-tauri/gen/android -name '*-release-unsigned.apk' | head -1)" ../out/Veil-android-arm64-unsigned.apk

      - name: Check the hardening reached the APK
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          M=$("$BT/aapt2" dump xmltree --file AndroidManifest.xml out/Veil-android-arm64-unsigned.apk)
          echo "$M" | grep -E 'allowBackup|dataExtractionRules|fullBackupContent'
          echo "$M" | grep -E 'allowBackup.*=false'
          echo "$M" | grep -q dataExtractionRules

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-unsigned
          path: out/
          if-no-files-found: error
          retention-days: 7

  windows:
    needs: frontend
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "10.28.0"

      - name: Rust toolchain, protoc
        shell: pwsh
        run: |
          # Fail on any failing native command, not only the last one (review P4R2-5).
          $PSNativeCommandUseErrorActionPreference = $true
          $ErrorActionPreference = "Stop"
          rustup toolchain install 1.97.0 --profile minimal
          rustup default 1.97.0
          choco install protoc --version 29.3.0 -y --no-progress
          protoc --version

      - name: Build NSIS installer
        working-directory: app
        shell: pwsh
        env:
          # OpenSSL's Configure needs a full Perl; Git for Windows' Perl lacks modules.
          OPENSSL_SRC_PERL: C:\Strawberry\perl\bin\perl.exe
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $ErrorActionPreference = "Stop"
          pnpm install --frozen-lockfile
          pnpm tauri build --bundles nsis -- --locked
          New-Item -ItemType Directory -Force ../out | Out-Null
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Copy-Item $exe.FullName ../out/Veil-windows-x64-setup.exe

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: out/
          if-no-files-found: error
          retention-days: 7

  # Runs only for a release, in the protected environment, on the unsigned APK alone: no
  # checkout, no project code, nothing that could read or replace the key.
  sign-android:
    needs: android
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-unsigned
          path: in
      - name: Align and sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          KS="$RUNNER_TEMP/release.jks"
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$KS"
            SIGNING="release key"
          else
            export KEYSTORE_PASSWORD KEY_ALIAS
            KEYSTORE_PASSWORD=$(openssl rand -hex 24)
            KEY_ALIAS=veil-ephemeral
            keytool -genkeypair -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" \
              -alias "$KEY_ALIAS" -keyalg EC -groupname secp256r1 -validity 3650 -dname "CN=Veil ephemeral CI key"
            SIGNING="throwaway key generated in this CI run (cannot be updated in place)"
          fi
          mkdir -p out
          # -P 16: native libraries stay 16 KiB page-aligned (review P4R2-4).
          "$BT/zipalign" -f -P 16 4 in/Veil-android-arm64-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/zipalign" -c -P 16 4 "$RUNNER_TEMP/aligned.apk"
          # The password reaches apksigner through the environment, never argv.
          "$BT/apksigner" sign --ks "$KS" --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEYSTORE_PASSWORD \
            --out out/Veil-android-arm64.apk "$RUNNER_TEMP/aligned.apk"
          rm -f "$KS"
          "$BT/apksigner" verify --verbose --print-certs out/Veil-android-arm64.apk
          echo "$SIGNING" > out/android-signing.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: out/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [sign-android, windows, app-supply-chain]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{android,windows}"
          path: dist
          merge-multiple: true
      - name: Checksums and release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The tag becomes a CLI argument: allow version-like names only.
          [[ "$TAG" =~ ^v[0-9][0-9A-Za-z.-]*$ ]] || { echo "bad tag"; exit 1; }
          cd dist
          SIGNING=$(cat android-signing.txt)
          rm android-signing.txt
          sha256sum Veil-android-arm64.apk Veil-windows-x64-setup.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cat > notes.md <<EOF
          Preview build of Veil from commit $SHA. **Not independently audited.**

          Scope: one relay, one-to-one text messaging, invites by link, safety-number verification.
          Not in this build: attachments, voice notes, calls, disappearing messages, backup, notifications.

          - Android (arm64): signed with a $SIGNING.
          - Windows (x64): not code-signed; SmartScreen will warn.

          Verify downloads against SHA256SUMS.txt:
          \`\`\`
          $(cat SHA256SUMS.txt)
          \`\`\`
          EOF
          gh release create "$TAG" --target "$SHA" --prerelease --title "Veil $TAG" --notes-file notes.md \
            Veil-android-arm64.apk Veil-windows-x64-setup.exe SHA256SUMS.txt
