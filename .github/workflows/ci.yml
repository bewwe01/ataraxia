# Veil CI: lint, test, supply chain, fuzz smoke, Miri. Actions pinned by commit SHA (ADR-0008).
name: ci

on:
  push:
    branches: [main, ccr-1230ecdf-lvfqsm]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.97.0"
  NIGHTLY: nightly-2026-10-01

jobs:
  rust:
    name: fmt + clippy + test
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_TOOLCHAIN"
          sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
      - name: Lockfile integrity (Cargo.lock must already be complete and unchanged)
        run: cargo metadata --locked --format-version 1 > /dev/null
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  supply-chain:
    name: cargo deny + audit + vet + secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install tools (built from source, exact versions)
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && rustup default "$RUST_TOOLCHAIN"
          cargo install cargo-deny --version 0.20.2 --locked
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-vet --version 0.10.2 --locked
      - run: cargo deny --locked check
      - run: cargo audit --deny warnings
      - run: cargo vet --locked
      - name: Secret scan (gitleaks, pinned SHA-256)
        run: |
          # The hash is pinned here, not read from the same release (review L8). Verified
          # 2026-10-19 against the release's own gitleaks_8.30.1_checksums.txt.
          V=8.30.1
          F="gitleaks_${V}_linux_x64.tar.gz"
          curl -sSfLo "$F" "https://github.com/gitleaks/gitleaks/releases/download/v${V}/${F}"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  ${F}" | sha256sum -c -
          tar xzf "$F" gitleaks
          ./gitleaks git --redact --exit-code 1 .

  fuzz-smoke:
    name: fuzz smoke (60 s per target)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Nightly + cargo-fuzz
        run: |
          rustup toolchain install "$NIGHTLY" --profile minimal
          cargo +"$NIGHTLY" install cargo-fuzz --version 0.13.2 --locked
          sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
      - name: Fuzz lockfile must be complete and unchanged
        run: cargo +"$NIGHTLY" metadata --locked --format-version 1 --manifest-path crates/core/fuzz/Cargo.toml > /dev/null
      - name: Run every target
        working-directory: crates/core/fuzz
        run: |
          for t in $(cargo +"$NIGHTLY" fuzz list); do
            echo "::group::$t"
            cargo +"$NIGHTLY" fuzz run -O "$t" "corpus/$t" -- -max_total_time=60 -max_len=70000 -rss_limit_mb=2048
            echo "::endgroup::"
          done
      - name: Print crashing inputs (hex) so they can be reproduced
        if: failure()
        working-directory: crates/core/fuzz
        run: |
          for f in artifacts/*/*; do [ -f "$f" ] && { echo "== $f"; xxd -p "$f"; }; done || true

  miri:
    name: miri (pure modules)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          rustup toolchain install "$NIGHTLY" --profile minimal --component miri,rust-src
          sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
      - name: Miri on padding, envelope, ice, trust, content
        env:
          PROPTEST_CASES: "4"
          MIRIFLAGS: -Zmiri-disable-isolation
        run: |
          cargo +"$NIGHTLY" miri test -p veil-core --lib -- padding:: envelope:: ice:: trust:: content::

  vectors:
    name: known-answer vectors match the Python oracle
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Regenerate vectors with the independent oracle and compare
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt
          python3 -m venv /tmp/oracle
          /tmp/oracle/bin/pip install --quiet --require-hashes --only-binary=:all: -r crates/core/tests/vectors/requirements.txt
          cd crates/core/tests/vectors
          /tmp/oracle/bin/python3 -I gen.py > /tmp/vectors.rs
          rustfmt +"$RUST_TOOLCHAIN" --edition 2024 --config-path "$GITHUB_WORKSPACE/rustfmt.toml" /tmp/vectors.rs
          diff -u vectors.rs /tmp/vectors.rs

  fuzz-hooks-lint:
    name: clippy on cfg(fuzzing) code
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
      - name: Lint the fuzz-only hooks
        env:
          RUSTFLAGS: --cfg fuzzing
          CARGO_TARGET_DIR: target/fuzzing-lint
        run: cargo +"$RUST_TOOLCHAIN" clippy -p veil-core --lib --locked -- -D warnings


  relay-deploy:
    name: relay container + coturn smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - name: Bring up deploy/ exactly as the README describes
        working-directory: deploy
        run: |
          ip=$(hostname -I | awk '{print $1}')
          {
            echo "TURN_EXTERNAL_IP=$ip"
            echo "VEIL_TURN_URLS=turn:$ip:3478?transport=udp,turn:$ip:3478?transport=tcp"
          } > .env
          mkdir -m 0700 secrets
          openssl rand -hex 32 > secrets/turn_secret
          chmod 0644 secrets/turn_secret
          docker compose build
          docker compose run --rm relay gen-cert /data/tls localhost 127.0.0.1 | tee gen.txt
          echo "PIN=$(awk '/pin:/ {print $NF}' gen.txt)" >> "$GITHUB_ENV"
          echo "TURN_IP=$ip" >> "$GITHUB_ENV"
          # A second gen-cert must refuse to replace the key.
          if docker compose run --rm relay gen-cert /data/tls other; then exit 1; fi
          docker compose up -d
          sleep 3
          docker compose ps
          test "$(docker compose ps --status running -q | wc -l)" = 2
      - name: Relay round trip through the container
        env:
          VEIL_SMOKE_ADDR: 127.0.0.1:8443
          VEIL_SMOKE_TURN_OUT: ${{ runner.temp }}/turn
        run: VEIL_SMOKE_PIN="$PIN" cargo test --locked -p veil-relay --test smoke -- --ignored
      - name: coturn accepts relay-minted credentials and refuses private peers
        run: |
          cred() { sed -n "$1p" "$RUNNER_TEMP/turn"; }
          uc() { docker run --rm --network host --entrypoint turnutils_uclient \
            docker.io/coturn/coturn:4.7.0@sha256:a00afb5b4890de4df22bbe70379c6b316685dffee297d53cac1271dcb91fab93 "$@" 2>&1; }
          uc -y -c -n 20 -m 1 -l 170 -u "$(cred 1)" -w "$(cred 2)" -r veil "$TURN_IP" | tee ok.txt
          grep -q "Total lost packets 0 " ok.txt
          uc -c -e 10.0.0.1 -n 5 -m 1 -u "$(cred 3)" -w "$(cred 4)" -r veil "$TURN_IP" | tee denied.txt
          grep -q "403 (Forbidden IP)" denied.txt
          uc -y -c -n 5 -m 1 -u "$(cred 5)" -w "wrong$(cred 6)" -r veil "$TURN_IP" | tee bad.txt
          grep -q "Cannot complete Allocation" bad.txt
      - name: Nothing about clients in either container's logs
        working-directory: deploy
        run: |
          docker compose logs relay | tee relay.log
          test "$(wc -l < relay.log)" = 1
          grep -q "veil-relay started" relay.log
          test "$(docker compose logs coturn | wc -l)" = 0
      - if: always()
        working-directory: deploy
        run: docker compose down -v
