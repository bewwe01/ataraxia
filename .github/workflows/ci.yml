# Veil CI: lint, test, supply chain, fuzz smoke, Miri. Actions pinned by commit SHA (ADR-0008).
name: ci

on:
  push:
    branches: [main, ccr-1230ecdf-lvfqsm]
    # Docs-only pushes need no build (saves Actions minutes).
    paths-ignore: ["docs/**", "**.md", "design/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.97.0"
  NIGHTLY: nightly-2026-10-01

jobs:
  rust:
    name: fmt + clippy + test
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_TOOLCHAIN"
          sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
      - name: Lockfile integrity (Cargo.lock must already be complete and unchanged)
        run: cargo metadata --locked --format-version 1 > /dev/null
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  supply-chain:
    name: cargo deny + audit + vet + secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install tools (built from source, exact versions)
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && rustup default "$RUST_TOOLCHAIN"
          cargo install cargo-deny --version 0.20.2 --locked
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-vet --version 0.10.2 --locked
      - run: cargo deny --locked check
      - run: cargo audit --deny warnings
      - run: cargo vet --locked
      - name: Secret scan (gitleaks, pinned SHA-256)
        run: |
          # The hash is pinned here, not read from the same release (review L8). Verified
          # 2026-10-19 against the release's own gitleaks_8.30.1_checksums.txt.
          V=8.30.1
          F="gitleaks_${V}_linux_x64.tar.gz"
          curl -sSfLo "$F" "https://github.com/gitleaks/gitleaks/releases/download/v${V}/${F}"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  ${F}" | sha256sum -c -
          tar xzf "$F" gitleaks
          ./gitleaks git --redact --exit-code 1 .

  fuzz-smoke:
    name: fuzz smoke (60 s per target)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Nightly + cargo-fuzz
        run: |
          rustup toolchain install "$NIGHTLY" --profile minimal
          cargo +"$NIGHTLY" install cargo-fuzz --version 0.13.2 --locked
          sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
      - name: Fuzz lockfile must be complete and unchanged
        run: cargo +"$NIGHTLY" metadata --locked --format-version 1 --manifest-path crates/core/fuzz/Cargo.toml > /dev/null
      - name: Run every target
        working-directory: crates/core/fuzz
        run: |
          for t in $(cargo +"$NIGHTLY" fuzz list); do
            echo "::group::$t"
            cargo +"$NIGHTLY" fuzz run -O "$t" "corpus/$t" -- -max_total_time=60 -max_len=70000 -rss_limit_mb=2048
            echo "::endgroup::"
          done
      - name: Print crashing inputs (hex) so they can be reproduced
        if: failure()
        working-directory: crates/core/fuzz
        run: |
          for f in artifacts/*/*; do [ -f "$f" ] && { echo "== $f"; xxd -p "$f"; }; done || true

  miri:
    name: miri (pure modules)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          rustup toolchain install "$NIGHTLY" --profile minimal --component miri,rust-src
          sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
      - name: Miri on padding, envelope, ice, trust, content
        env:
          PROPTEST_CASES: "4"
          MIRIFLAGS: -Zmiri-disable-isolation
        run: |
          cargo +"$NIGHTLY" miri test -p veil-core --lib -- padding:: envelope:: ice:: trust:: content::

  vectors:
    name: known-answer vectors match the Python oracle
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Regenerate vectors with the independent oracle and compare
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt
          python3 -m venv /tmp/oracle
          /tmp/oracle/bin/pip install --quiet --require-hashes --only-binary=:all: -r crates/core/tests/vectors/requirements.txt
          cd crates/core/tests/vectors
          /tmp/oracle/bin/python3 -I gen.py > /tmp/vectors.rs
          rustfmt +"$RUST_TOOLCHAIN" --edition 2024 --config-path "$GITHUB_WORKSPACE/rustfmt.toml" /tmp/vectors.rs
          diff -u vectors.rs /tmp/vectors.rs

  fuzz-hooks-lint:
    name: clippy on cfg(fuzzing) code
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
      - name: Lint the fuzz-only hooks
        env:
          RUSTFLAGS: --cfg fuzzing
          CARGO_TARGET_DIR: target/fuzzing-lint
        run: cargo +"$RUST_TOOLCHAIN" clippy -p veil-core --lib --locked -- -D warnings


  relay-deploy:
    name: relay container + coturn smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          # The test client links veil-core (libsignal), whose build scripts need protoc.
          sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
      - name: Bring up deploy/ exactly as the README describes
        working-directory: deploy
        run: |
          ip=$(hostname -I | awk '{print $1}')
          {
            echo "TURN_EXTERNAL_IP=$ip"
            echo "VEIL_TURN_URLS=turn:$ip:3478?transport=udp,turn:$ip:3478?transport=tcp"
            echo "VEIL_QUOTA_ENVELOPES_MB=2048"   # room for the 1.1 GB soak below
          } > .env
          mkdir -m 0700 secrets
          openssl rand -hex 32 > secrets/turn_secret
          chmod 0644 secrets/turn_secret
          docker compose build
          docker compose run --rm relay gen-cert /data/tls localhost 127.0.0.1 | tee gen.txt
          echo "PIN=$(awk '/pin:/ {print $NF}' gen.txt)" >> "$GITHUB_ENV"
          echo "TURN_IP=$ip" >> "$GITHUB_ENV"
          # A second gen-cert must refuse to replace the key.
          if docker compose run --rm relay gen-cert /data/tls other; then exit 1; fi
          docker compose up -d
          sleep 3
          docker compose ps
          test "$(docker compose ps --status running -q | wc -l)" = 2
      - name: Relay round trip through the container
        env:
          VEIL_SMOKE_ADDR: 127.0.0.1:8443
          VEIL_SMOKE_TURN_OUT: ${{ runner.temp }}/turn
        run: VEIL_SMOKE_PIN="$PIN" cargo test --locked -p veil-relay --test smoke deployed_relay_round_trip -- --ignored
      - name: Install the TURN host firewall rule (deploy/README.md)
        run: sudo nft -f deploy/firewall/veil-turn.nft
      - name: coturn accepts relay-minted credentials and refuses private peers and host ports
        run: |
          cred() { sed -n "$1p" "$RUNNER_TEMP/turn"; }
          uc() { docker run --rm --network host --entrypoint turnutils_uclient \
            docker.io/coturn/coturn:4.18.0@sha256:bbefd3e1fdfdc0d58770fe01b581fd8b00d9f3a5580d00acb77cf719a6bc78e3 "$@" 2>&1; }
          uc -y -c -n 20 -m 1 -l 170 -u "$(cred 1)" -w "$(cred 2)" "$TURN_IP" | tee ok.txt
          grep -q "Total lost packets 0 " ok.txt
          # The same over TCP, as a client behind Tailscale Funnel reaches coturn (ADR-0018).
          uc -t -y -c -n 20 -m 1 -l 170 -u "$(cred 11)" -w "$(cred 12)" "$TURN_IP" | tee tcp.txt
          grep -q "Total lost packets 0 " tcp.txt
          # And arriving on loopback, as Funnel delivers outsiders: relays must still use the
          # advertised address, or the two legs of a call cannot reach each other.
          uc -t -y -c -n 20 -m 1 -l 170 -u "$(cred 15)" -w "$(cred 16)" 127.0.0.1 | tee loopback.txt
          grep -q "Total lost packets 0 " loopback.txt
          uc -c -e 10.0.0.1 -n 5 -m 1 -u "$(cred 3)" -w "$(cred 4)" "$TURN_IP" | tee denied.txt
          grep -q "channel bind: error 403" denied.txt
          # Not the public internet either: this server relays only to itself (ADR-0018).
          uc -c -e 1.1.1.1 -n 5 -m 1 -u "$(cred 13)" -w "$(cred 14)" "$TURN_IP" | tee public.txt
          grep -q "channel bind: error 403" public.txt
          uc -y -c -n 5 -m 1 -u "$(cred 5)" -w "wrong$(cred 6)" "$TURN_IP" | tee bad.txt
          grep -q "Cannot complete Allocation" bad.txt
          # A host UDP service outside the relay range must not be reachable through TURN (P3-8).
          python3 -I -c '
          import socket, time
          s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM); s.bind(("'"$TURN_IP"'", 40000)); s.settimeout(0.5)
          n, end = 0, time.time() + 10
          while time.time() < end:
              try: s.recv(65536); n += 1
              except socket.timeout: pass
          print("udp packets received =", n)
          ' > host.txt &
          sleep 1
          uc -c -e "$TURN_IP" -r 40000 -n 5 -m 1 -u "$(cred 7)" -w "$(cred 8)" "$TURN_IP" | tee host-probe.txt
          wait
          cat host.txt
          grep -q "udp packets received = 0" host.txt
          # Also a UDP service *published by Docker* on the host (Pi-hole in Docker, say): the
          # rule must run before Docker's NAT (review P3R2-5).
          docker run -d --name udp-svc -p 40001:3480/udp --entrypoint turnutils_peer \
            docker.io/coturn/coturn:4.18.0@sha256:bbefd3e1fdfdc0d58770fe01b581fd8b00d9f3a5580d00acb77cf719a6bc78e3
          sleep 1
          uc -c -e "$TURN_IP" -r 40001 -n 5 -m 1 -u "$(cred 9)" -w "$(cred 10)" "$TURN_IP" | tee docker-probe.txt
          docker rm -f udp-svc
          grep -q "Total lost packets 5 (100" docker-probe.txt
          sudo nft list table inet veil_turn | grep -E "counter packets [1-9]"
      - name: TURN_LISTEN_IP keeps coturn on one address, and calls still connect
        working-directory: deploy
        run: |
          echo "TURN_LISTEN_IP=$TURN_IP" >> .env
          docker compose up -d --force-recreate coturn
          sleep 3
          ss -lunt | awk '$5 ~ /:3478$/ {print $5}' | sort -u | tee listen.txt
          test "$(cat listen.txt)" = "$TURN_IP:3478"
          docker run --rm --network host --entrypoint turnutils_uclient \
            docker.io/coturn/coturn:4.18.0@sha256:bbefd3e1fdfdc0d58770fe01b581fd8b00d9f3a5580d00acb77cf719a6bc78e3 \
            -y -c -n 20 -m 1 -l 170 -u "$(sed -n 17p "$RUNNER_TEMP/turn")" -w "$(sed -n 18p "$RUNNER_TEMP/turn")" "$TURN_IP" 2>&1 | tee listen-ok.txt
          grep -q "Total lost packets 0 " listen-ok.txt
      - name: Nothing about clients in either container's logs
        working-directory: deploy
        run: |
          docker compose logs relay | tee relay.log
          test "$(wc -l < relay.log)" = 1
          grep -q "veil-relay started" relay.log
          # coturn's logging is off. The only output allowed is the address-free stderr line it
          # prints when the host firewall drops a relay packet (the P3-8 probe).
          docker compose logs --no-log-prefix coturn | tee coturn.log
          test "$(grep -cv '^udp send: Operation not permitted$' coturn.log)" = 0
      - name: Soak (review P3-1) - 1.1 GB of envelopes, then two sweep intervals, under mem_limit 512m
        working-directory: deploy
        env:
          VEIL_SMOKE_ADDR: 127.0.0.1:8443
          VEIL_SOAK_MB: "1100"
        run: |
          VEIL_SMOKE_PIN="$PIN" cargo test --locked -p veil-relay --test smoke deployed_relay_soak -- --ignored --nocapture
          sleep 130
          id=$(docker compose ps -q relay)
          docker inspect -f 'OOMKilled={{.State.OOMKilled}} Restarts={{.RestartCount}} Running={{.State.Running}}' "$id" | tee state.txt
          grep -q "OOMKilled=false Restarts=0 Running=true" state.txt
          peak=$(cat /sys/fs/cgroup/system.slice/docker-"$id".scope/memory.peak 2>/dev/null || echo unknown)
          echo "relay memory.peak bytes: $peak"
          VEIL_SMOKE_PIN="$PIN" cargo test --locked -p veil-relay --test smoke deployed_relay_round_trip -- --ignored
      - name: docker stop is a clean SIGTERM shutdown (review P3-9)
        working-directory: deploy
        run: |
          start=$(date +%s)
          docker compose stop relay
          elapsed=$(( $(date +%s) - start ))
          echo "stopped in ${elapsed}s"
          test "$elapsed" -le 5
          test "$(docker inspect -f '{{.State.ExitCode}}' "$(docker compose ps -aq relay)")" = 0
          docker compose logs relay | grep -q "veil-relay stopped"
      - if: always()
        working-directory: deploy
        run: docker compose down -v

  firewall-unit:
    name: TURN firewall units under systemd (review P3R3-5, P3R4-2, P3R4-3)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install as deploy/README.md describes
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq nftables
          sudo install -m 0644 deploy/firewall/veil-turn.nft /etc/veil-turn.nft
          sudo install -m 0644 deploy/firewall/veil-turn-firewall.service /etc/systemd/system/
          sudo install -D -m 0644 deploy/firewall/docker-veil-turn.conf /etc/systemd/system/docker.service.d/veil-turn.conf
          sudo install -D -m 0644 deploy/firewall/nftables-veil-turn.conf /etc/systemd/system/nftables.service.d/veil-turn.conf
          sudo systemd-analyze verify /etc/systemd/system/veil-turn-firewall.service
          sudo systemctl daemon-reload
          sudo systemctl enable --now veil-turn-firewall
          sudo systemctl restart docker
          sudo nft list table inet veil_turn
          systemctl is-active docker
      - name: The rule survives every nftables.service transition (flush ruleset)
        run: |
          rule() { for _ in $(seq 1 20); do sudo nft list table inet veil_turn >/dev/null 2>&1 && return 0; sleep 0.25; done; echo "rule missing after: $1"; return 1; }
          grep -q "flush ruleset" /etc/nftables.conf
          sudo systemctl stop nftables;    rule "stop (from active)"
          sudo systemctl start nftables;   rule "start (from inactive)"
          sudo systemctl restart nftables; rule "restart"
          sudo systemctl reload nftables;  rule "reload"
          sudo systemctl stop nftables;    rule "stop"
      - name: Stopping the unit does not stop Docker; Docker refuses to start if the rule cannot load
        run: |
          sudo systemctl stop veil-turn-firewall
          systemctl is-active docker
          sudo mv /etc/veil-turn.nft /etc/veil-turn.nft.aside
          if sudo systemctl restart docker; then echo "Docker started without the rule"; exit 1; fi
          sudo mv /etc/veil-turn.nft.aside /etc/veil-turn.nft
          sudo systemctl start veil-turn-firewall
          # The refused start above leaves docker in "failed"; clear it before starting again.
          sudo systemctl reset-failed docker.service docker.socket || true
          if ! sudo systemctl restart docker; then
            sudo journalctl -u docker.service -n 40 --no-pager
            exit 1
          fi
          systemctl is-active docker
          sudo nft list table inet veil_turn
