[workspace]
resolver = "3"
members = ["crates/core", "crates/wire", "crates/relay", "crates/client"]
exclude = ["crates/core/fuzz", "spikes"]

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "AGPL-3.0-only"
repository = "https://github.com/bewwe01/ataraxia"
publish = false

[workspace.dependencies]
# libsignal is not on crates.io: pinned to an exact release tag (ADR-0001); Cargo.lock pins the commit.
libsignal-protocol = { git = "https://github.com/signalapp/libsignal", tag = "v0.105.0", version = "=0.1.0" }
# Versions aligned with libsignal's own dependency generation to avoid duplicate crypto crates.
aead-stream = { version = "=0.6.0", features = ["alloc"] }
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "getrandom"] }
hkdf = "=0.13.0"
hmac = "=0.13.0"
sha2 = "=0.11.1"
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "zeroize"] }
subtle = "=2.6.1"
zeroize = { version = "=1.9.1", features = ["derive"] }
secrecy = "=0.10.3"
rand = "=0.9.5"
prost = "=0.14.4"
thiserror = "=2.0.21"
async-trait = "=0.1.92"
base64 = "=0.23.1"
# relay (Phase 3). rustls uses the `ring` provider, not aws-lc-rs: aws-lc-sys carries
# OpenSSL-licensed code that may not be AGPL-compatible (see ARCHITECTURE ADR-0010).
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "net", "macros", "sync", "time", "signal", "io-util"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["logging", "ring"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "logging"] }
rustls-pki-types = { version = "=1.15.1", features = ["std"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["sink", "std"] }
redb = "=4.4.0"
ed25519-dalek = { version = "=3.0.0", features = ["rand_core"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
sha1 = "=0.11.0"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "std", "ansi"] }
veil-wire = { path = "crates/wire", version = "=0.1.0" }
veil-core = { path = "crates/core", version = "=0.1.0" }
veil-relay = { path = "crates/relay", version = "=0.1.0" }
# client (Phase 4). SQLCipher is vendored with its OpenSSL so the build is identical on every
# platform (no system libcrypto); see ARCHITECTURE ADR-0011.
rusqlite = { version = "=0.40.2", features = ["bundled-sqlcipher-vendored-openssl"] }
qrcode = { version = "=0.14.1", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }
# dev
tempfile = "=3.23.0"
proptest = "=1.12.0"
futures-executor = "=0.3.34"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "allow"
unused_must_use = "deny"
# `cargo fuzz` builds with `--cfg fuzzing` (fuzz-only hooks in crates/core/src/account.rs).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"

[profile.release]
overflow-checks = true
