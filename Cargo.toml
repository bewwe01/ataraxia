[workspace]
resolver = "3"
members = ["crates/core"]
exclude = ["crates/core/fuzz", "spikes"]

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "AGPL-3.0-only"
repository = "https://github.com/bewwe01/ataraxia"
publish = false

[workspace.dependencies]
# libsignal is not on crates.io: pinned to an exact release tag (ADR-0001); Cargo.lock pins the commit.
libsignal-protocol = { git = "https://github.com/signalapp/libsignal", tag = "v0.105.0", version = "=0.1.0" }
# Versions aligned with libsignal's own dependency generation to avoid duplicate crypto crates.
aead-stream = { version = "=0.6.0", features = ["alloc"] }
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "getrandom"] }
hkdf = "=0.13.0"
hmac = "=0.13.0"
sha2 = "=0.11.1"
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "zeroize"] }
subtle = "=2.6.1"
zeroize = { version = "=1.9.1", features = ["derive"] }
secrecy = "=0.10.3"
rand = "=0.9.5"
prost = "=0.14.4"
thiserror = "=2.0.21"
async-trait = "=0.1.92"
base64 = "=0.23.1"
# dev
proptest = "=1.12.0"
futures-executor = "=0.3.34"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "allow"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"

[profile.release]
overflow-checks = true
