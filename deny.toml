# cargo-deny policy (ADR-0008, INV-SUP-2). Run: cargo deny check

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Every ignore needs a written reason and a review date.
ignore = [
    # Unmaintained (not a vulnerability). Compile-time proc-macro only, pulled in by
    # hax-lib-macros <- libcrux-intrinsics <- libcrux-ml-kem <- libsignal/spqr. No runtime code.
    # Removing it requires changes upstream in libcrux/libsignal. Review: 2027-01-15.
    { id = "RUSTSEC-2026-0173", reason = "build-time proc-macro via libcrux (libsignal); unmaintained, not vulnerable" },
]

[licenses]
version = 2
confidence-threshold = 0.93
# Veil is AGPL-3.0-only; everything below is compatible with it.
allow = [
    "AGPL-3.0-only",     # Veil, libsignal, spqr
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
    "Unlicense",
    "BSL-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]

[bans]
# libsignal itself pulls two generations of rand_core/getrandom; review dupes, don't fail on them.
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = [
    # Only reviewed crypto (CLAUDE.md non-negotiable 1). OpenSSL is reserved for SQLCipher (ADR-0005)
    # and must be explicitly allowed here when that lands.
    { crate = "openssl", reason = "only via SQLCipher (ADR-0005), allow explicitly when added" },
    { crate = "openssl-sys", reason = "only via SQLCipher (ADR-0005), allow explicitly when added" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The only git dependencies allowed: libsignal and spqr, pinned by tag in Cargo.toml and by commit in Cargo.lock (ADR-0001).
allow-git = [
    "https://github.com/signalapp/libsignal",
    "https://github.com/signalapp/SparsePostQuantumRatchet.git",
]
